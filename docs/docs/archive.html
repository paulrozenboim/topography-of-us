<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Topography of Us — Archive</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{overflow:auto}
  .archive{max-width:1280px;margin:0 auto;padding:var(--pad)}
  .archive header{display:flex;align-items:flex-start;justify-content:space-between;
    gap:14px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
  .archive .head-l{flex:1;min-width:0}
  .archive h1{font-size:clamp(22px,3.4vw,36px);font-weight:800;font-variation-settings:'wdth' 118;
    text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
  .archive .head-meta{font-family:'Martian Mono',monospace;font-size:10.5px;color:var(--ink-3);
    letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
  .archive .head-meta b{color:var(--ink-2)}
  .archive .head-actions{display:flex;gap:6px;flex-shrink:0}
  .archive .head-btn{display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;background:none;border:none;color:var(--ink-2);cursor:pointer;
    box-shadow:inset 0 0 0 1px var(--hair);font-size:14px;line-height:1;padding:0;
    font-family:'Martian Mono',monospace}
  .archive .head-btn:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}

  .archive .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .archive .filters .chip{font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:8px 12px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2);
    cursor:pointer;background:none;border:none}
  .archive .filters .chip:hover{color:var(--ink)}
  .archive .filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
  .archive .filters .divider{width:1px;height:24px;background:var(--hair);margin:0 4px}

  /* --- Bulk action bar (visible only in select-mode) --- */
  .select-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:14px;
    background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);
    font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:.08em}
  .select-bar[hidden]{display:none}
  .select-bar .sel-count{color:var(--ink);font-weight:600;margin-right:auto;
    font-family:'Martian Mono',monospace;font-size:11px}
  .select-bar button{padding:8px 12px;background:none;color:var(--ink-2);border:none;
    box-shadow:inset 0 0 0 1px var(--hair);cursor:pointer;font:inherit;letter-spacing:.14em;
    text-transform:uppercase;font-size:10px}
  .select-bar button:hover:not([disabled]){color:var(--ink)}
  .select-bar button[disabled]{opacity:.35;cursor:not-allowed}
  .select-bar button.primary{background:var(--ink);color:var(--bg);box-shadow:none}
  .select-bar button.primary[disabled]{background:var(--hair);color:var(--ink-3)}
  .select-bar button.danger{box-shadow:inset 0 0 0 1px var(--line-f);color:var(--line-f)}
  .select-bar button.danger:hover:not([disabled]){background:var(--line-f);color:var(--bg)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;
    box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .15s}
  .card:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
  .card .thumb{position:relative;aspect-ratio:1.4;background:var(--bg-2);overflow:hidden}
  .card .thumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .card .meta{padding:10px 12px 12px;font-family:'Martian Mono',monospace;font-size:10px;
    letter-spacing:.06em;color:var(--ink-3);line-height:1.5}
  .card .meta .from{color:var(--ink);font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    font-size:10.5px;margin-bottom:3px}
  .card .meta .count{color:var(--ink-2)}
  .card .meta .when{margin-top:4px;font-size:9.5px}
  .card .meta .seeded{display:inline-block;margin-left:6px;padding:1px 5px;font-size:8.5px;
    background:var(--hair);color:var(--ink-3);letter-spacing:.14em}

  /* Per-card action buttons — sit over the thumbnail so they're reachable
     without breaking the card-wide anchor. Nested buttons inside <a> are
     handled with preventDefault on click, not by nesting HTML validators like. */
  .card{position:relative}
  .card-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2;opacity:0;
    transition:opacity .15s}
  .card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
  .card-actions .act{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
    padding:0;border:none;background:rgba(0,0,0,.55);color:#fff;font-family:'Martian Mono',monospace;
    font-size:12px;line-height:1;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .card-actions .act:hover{background:rgba(0,0,0,.85)}
  .card-actions .act.danger:hover{background:var(--line-f)}
  /* On touch devices actions are always visible — no hover state to rely on. */
  @media (hover:none){ .card-actions{opacity:1} }

  /* --- Select mode: hide per-card actions, show a checkbox indicator top-left,
     switch the whole card into a click-to-toggle affordance. --- */
  .archive.select-mode .card{cursor:pointer}
  .archive.select-mode .card-actions{display:none}
  .archive.select-mode .card::before{
    content:"";position:absolute;top:8px;left:8px;width:22px;height:22px;z-index:3;
    background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    font-family:'Martian Mono',monospace;font-size:14px;font-weight:700;line-height:1;
    color:transparent;transition:.12s
  }
  .archive.select-mode .card.selected::before{
    content:"\2713";background:var(--ink);border-color:var(--ink);color:var(--bg)
  }
  .archive.select-mode .card.selected{box-shadow:inset 0 0 0 2px var(--ink)}
  .archive.select-mode .card.selected:hover{box-shadow:inset 0 0 0 2px var(--ink)}

  .empty{padding:80px 22px;text-align:center;color:var(--ink-2);font-family:'Martian Mono',monospace;
    font-size:12px;line-height:1.7}
  .empty a{color:var(--ink);text-decoration:underline}
</style>
</head>
<body>
<div class="archive" id="archive">
  <header>
    <div class="head-l">
      <div class="eyebrow">Archive</div>
      <h1>Every cast, in order</h1>
      <div class="head-meta" id="headMeta"></div>
    </div>
    <div class="head-actions">
      <button class="head-btn" id="themeBtn" type="button" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="filters" id="filters">
    <button class="chip" data-filter="all"    aria-pressed="true">All</button>
    <button class="chip" data-filter="real"   aria-pressed="false">Real casts only</button>
    <button class="chip" data-filter="seeded" aria-pressed="false">Demo only</button>
    <span class="divider"></span>
    <button class="chip" id="selectToggle" type="button" aria-pressed="false">Select</button>
  </div>

  <div class="select-bar" id="selectBar" hidden>
    <span class="sel-count" id="selCount">0 selected</span>
    <button type="button" id="selectAllBtn">Select all shown</button>
    <button type="button" id="deselectAllBtn">Deselect</button>
    <button type="button" id="exportSelBtn" class="primary" disabled>Export selected</button>
    <button type="button" id="deleteSelBtn" class="danger" disabled>Delete selected</button>
    <button type="button" id="cancelSelBtn">Cancel</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script src="assets/remote-config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/core.js"></script>
<script src="assets/nav.js"></script>
<script>
"use strict";
const archiveEl = document.getElementById("archive");
const grid = document.getElementById("grid");
const headMeta = document.getElementById("headMeta");
const filters = document.getElementById("filters");
const themeBtn = document.getElementById("themeBtn");
const selectToggle = document.getElementById("selectToggle");
const selectBar = document.getElementById("selectBar");
const selCount = document.getElementById("selCount");
const selectAllBtn = document.getElementById("selectAllBtn");
const deselectAllBtn = document.getElementById("deselectAllBtn");
const exportSelBtn = document.getElementById("exportSelBtn");
const deleteSelBtn = document.getElementById("deleteSelBtn");
const cancelSelBtn = document.getElementById("cancelSelBtn");

let filterMode = "all";
let selectMode = false;
const selectedIds = new Set();

initQuickNav({current:"archive"});

// Theme is the unified Store.theme — flipping it here also flips Cast Path,
// Projection and Settings on any device that's on the same Sync channel.
// store.js auto-applies Store.theme to :root, and the Store.sub -> render
// binding below re-paints thumbnails when it flips.
themeBtn.onclick = () => Store.setTheme(Store.theme === "dark" ? "light" : "dark");

function fmtDate(t){
  if(!t) return "";
  try{
    return new Date(t).toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
  }catch(_){ return "" }
}

function render(){
  // newest first — sort defensive-copy so we don't mutate Store.paths
  let paths = Store.paths.slice().sort((a,b)=>(b.t||0)-(a.t||0));
  if(filterMode==="real")   paths = paths.filter(p=>!p.seeded);
  if(filterMode==="seeded") paths = paths.filter(p=>p.seeded);

  const total = Store.paths.length;
  const real = Store.paths.filter(p=>!p.seeded).length;
  const seed = total - real;
  headMeta.innerHTML = `<b>${total}</b> total &middot; <b>${real}</b> real &middot; <b>${seed}</b> demo`;

  if(!paths.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No paths in this session yet.<br><br>
      <a href="tablet.html">Trace one on the Cast Path page &rarr;</a></div>`;
    return;
  }

  grid.innerHTML = "";
  for(const p of paths){
    const anchor = NODES[p.nodes[0]] || {n:"?"};
    const url = `view.html#p=${encodePath(p.nodes)}${p.t?"&t="+encodeTime(p.t):""}`;
    const card = document.createElement("a");
    card.className = "card" + (selectedIds.has(p.id) ? " selected" : "");
    card.dataset.pathId = p.id;
    card.href = url;
    card.target = "_blank";
    card.rel = "noopener";
    card.innerHTML = `
      <div class="card-actions" data-id="${p.id}">
        <button type="button" class="act" data-act="print" title="Print this constellation" aria-label="Print">⎙</button>
        <button type="button" class="act danger" data-act="delete" title="Remove from archive" aria-label="Delete">×</button>
      </div>
      <div class="thumb"><canvas></canvas></div>
      <div class="meta">
        <div class="from">${anchor.n}${p.seeded?'<span class="seeded">DEMO</span>':''}</div>
        <div class="count">${p.nodes.length} stations</div>
        <div class="when">${fmtDate(p.t)}</div>
      </div>`;
    grid.appendChild(card);
    // render the thumbnail after the DOM lands so the canvas parent has size
    const canvas = card.querySelector("canvas");
    requestAnimationFrame(()=>renderConstellation(canvas, p.nodes, Store.theme));
  }
}

// ---- Select mode --------------------------------------------------------------
function currentlyShownIds(){
  return [...grid.querySelectorAll(".card")].map(c=>c.dataset.pathId).filter(Boolean);
}
function updateSelectBar(){
  const n = selectedIds.size;
  selCount.textContent = `${n} selected`;
  exportSelBtn.disabled = n === 0;
  deleteSelBtn.disabled = n === 0;
}
function enterSelectMode(){
  selectMode = true;
  archiveEl.classList.add("select-mode");
  selectBar.hidden = false;
  selectToggle.setAttribute("aria-pressed", "true");
  updateSelectBar();
}
function exitSelectMode(){
  selectMode = false;
  archiveEl.classList.remove("select-mode");
  selectBar.hidden = true;
  selectToggle.setAttribute("aria-pressed", "false");
  selectedIds.clear();
  render();
  updateSelectBar();
}
selectToggle.onclick = () => selectMode ? exitSelectMode() : enterSelectMode();
cancelSelBtn.onclick = exitSelectMode;

selectAllBtn.onclick = () => {
  for(const id of currentlyShownIds()) selectedIds.add(id);
  render(); updateSelectBar();
};
deselectAllBtn.onclick = () => {
  selectedIds.clear(); render(); updateSelectBar();
};

exportSelBtn.onclick = () => {
  const chosen = Store.paths.filter(p => selectedIds.has(p.id));
  if(!chosen.length) return;
  const payload = {
    exported: new Date().toISOString(),
    count: chosen.length,
    stations: NODES.map(n=>({id:n.id, n:n.n, c:n.c})),
    paths: chosen
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `topography-of-us-selection-${stamp}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

deleteSelBtn.onclick = () => {
  const n = selectedIds.size;
  if(!n) return;
  if(!confirm(`Remove ${n} path${n===1?"":"s"} from the archive? This can't be undone.`)) return;
  for(const id of [...selectedIds]) Store.removePath(id);
  selectedIds.clear();
  updateSelectBar();
};

filters.addEventListener("click", ev => {
  const btn = ev.target.closest(".chip[data-filter]"); if(!btn) return;
  filterMode = btn.dataset.filter;
  [...filters.children].forEach(b=>b.setAttribute("aria-pressed", b===btn ? "true" : "false"));
  render();
});

// Grid click delegation:
//   (A) In select mode, a click on any card toggles selection (blocks navigation).
//   (B) Any click on the card action buttons (print / delete) is intercepted
//       before the anchor's default so it doesn't ALSO open the card link.
grid.addEventListener("click", ev => {
  const act = ev.target.closest(".card-actions .act");
  const card = ev.target.closest(".card");

  // (B) action buttons
  if(act && card){
    ev.preventDefault();
    ev.stopPropagation();
    const id = card.dataset.pathId;
    const p = Store.paths.find(x=>x.id===id);
    if(!p) return;
    if(act.dataset.act === "delete"){
      if(confirm(`Remove this path (${NODES[p.nodes[0]].n} → ${p.nodes.length} stations) from the archive?\nThis can't be undone.`)){
        Store.removePath(id);
      }
    } else if(act.dataset.act === "print"){
      // Open view.html in a new tab with ?print=1 — view.html auto-triggers the
      // browser print dialog and uses its own thermal-friendly print CSS.
      const url = `view.html?print=1#p=${encodePath(p.nodes)}${p.t?"&t="+encodeTime(p.t):""}`;
      window.open(url, "_blank", "noopener");
    }
    return;
  }

  // (A) select-mode card toggle
  if(selectMode && card){
    ev.preventDefault();
    ev.stopPropagation();
    const id = card.dataset.pathId;
    if(!id) return;
    if(selectedIds.has(id)){ selectedIds.delete(id); card.classList.remove("selected"); }
    else { selectedIds.add(id); card.classList.add("selected"); }
    updateSelectBar();
  }
});

Store.sub(render);
render();
Sync.hello();
</script>
</body>
</html>
