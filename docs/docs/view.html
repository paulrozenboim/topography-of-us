<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Topography of Us — Your constellation</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{overflow:auto}
  .viewer{min-height:100vh;display:flex;flex-direction:column;padding:22px;gap:14px;max-width:640px;margin:0 auto}
  .viewer header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .viewer .head-l{flex:1;min-width:0}
  .viewer h1{font-size:clamp(20px,4.5vw,28px);font-weight:800;font-variation-settings:'wdth' 118;
    text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
  .viewer .head-actions{display:flex;gap:6px;flex-shrink:0}
  .viewer .head-btn{display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;background:none;border:none;color:var(--ink-2);cursor:pointer;
    box-shadow:inset 0 0 0 1px var(--hair);font-size:14px;line-height:1;padding:0;
    font-family:'Martian Mono',monospace}
  .viewer .head-btn:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
  .viewer .head-btn.wide{width:auto;padding:0 12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
  .viewer .const{position:relative;flex:1;min-height:clamp(320px,60vh,540px);
    box-shadow:inset 0 0 0 1px var(--hair)}
  /* Canvas draws the constellation but is never actually shown — the drawing is
     exported to an <img> so mobile long-press → "Save Image" works. Canvases
     don't offer that context-menu on iOS or Android. */
  .viewer .const canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
  .viewer .const img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;display:block}
  .viewer .stops{display:flex;flex-wrap:wrap;gap:6px}
  .viewer .stops span{display:inline-flex;align-items:center;gap:6px;font-family:'Martian Mono',monospace;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;box-shadow:inset 0 0 0 1px var(--hair)}
  .viewer .stops i{width:7px;height:7px;border-radius:50%}
  .viewer .hint{font-family:'Martian Mono',monospace;font-size:10.5px;line-height:1.6;color:var(--ink-3);
    letter-spacing:.03em}
  .viewer .hint b{color:var(--ink-2);font-weight:600}
  .viewer .credits{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
  .empty{padding:40px 22px;text-align:center;color:var(--ink-2);font-family:'Martian Mono',monospace;
    font-size:11px;line-height:1.7}
  .empty a{color:var(--ink);text-decoration:underline}

  /* --- Print: thermal receipt layout for view.html (used by archive.html's
     Print button which navigates here with ?print=1 and auto-fires window.print).
     Mirrors the tablet's receipt: title, constellation, credits, ~70mm wide. --- */
  @media print{
    @page{size:72mm auto;margin:3mm}
    html,body{background:#fff;color:#000;overflow:visible;height:auto;margin:0;padding:0}
    body *{visibility:hidden}
    .viewer{padding:0!important;max-width:none!important;margin:0!important;display:block!important;min-height:0!important}
    .viewer *{visibility:visible;color:#000!important}
    .viewer .head-actions, .viewer .hint{display:none!important}
    .viewer header{display:block!important;text-align:center;padding:0!important;margin:0 0 2mm 0!important;border:none!important}
    .viewer h1{font-size:14pt!important;font-weight:800!important;line-height:1.1!important;margin:0!important}
    .viewer .head-l .eyebrow{display:none!important}
    .viewer .const{box-shadow:none!important;background:#fff!important;
      min-height:0!important;height:auto!important;margin:2mm 0 3mm 0!important;
      line-height:0}
    .viewer .const canvas{position:static!important;display:block!important;
      width:100%!important;height:auto!important;inset:auto!important}
    .viewer .const img{display:none!important}
    .viewer .stops{display:none!important}
    .viewer .credits{margin-top:3mm!important;padding-top:2mm!important;
      border-top:1px dashed #000!important;text-align:center;font-family:'Martian Mono',monospace}
    .viewer .credits .row, .viewer .credits .row-link{display:block!important;
      margin-bottom:0.6mm!important;font-size:7pt!important;line-height:1.4!important;
      overflow-wrap:anywhere;text-align:center;padding:0!important;border:none!important}
  }
</style>
</head>
<body>
<div class="viewer" id="wrap">
  <header>
    <div class="head-l">
      <h1 id="title">Your constellation</h1>
      <div class="eyebrow">Teder · Tel Aviv</div>
    </div>
    <div class="head-actions" id="headActions">
      <button class="head-btn" id="themeBtn" type="button" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
      <button class="head-btn wide" id="printBtn" type="button" title="Print this constellation">Print</button>
    </div>
  </header>
  <div class="const" id="constWrap">
    <canvas id="star" aria-hidden="true"></canvas>
    <img id="starImg" alt="Your constellation">
  </div>
  <div class="stops" id="stops"></div>
  <p class="hint" id="hint"><b>Long-press the image to save it.</b> This link stays live — you can come back to it, share it, or open it on another device.</p>
  <div class="credits">
    <div class="row"><b>The Topography of Us</b><span>Democracy Week · Tel Aviv · 2026</span></div>
    <div class="row"><span>Cast at Teder</span><span id="castDate"></span></div>
    <a class="row row-link" href="https://www.instagram.com/unapaulogetic_" target="_blank" rel="noopener">
      <span>Made by <b>@unapaulogetic_</b></span>
      <span>instagram.com/unapaulogetic_ →</span>
    </a>
  </div>
</div>

<script src="assets/store.js"></script>
<script src="assets/core.js"></script>
<script>
"use strict";
const wrap=document.getElementById("wrap");
const star=document.getElementById("star");
const stops=document.getElementById("stops");
const title=document.getElementById("title");
const themeBtn=document.getElementById("themeBtn");
const printBtn=document.getElementById("printBtn");

// Theme: pull from localStorage first (participant's manual choice sticks across
// visits on the same device); fall back to the phone's OS preference on a first
// visit. Manual toggle takes over from OS.
const THEME_KEY = "topo-view-theme";
const osPrefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
let theme = localStorage.getItem(THEME_KEY) || (osPrefersDark ? "dark" : "light");
document.documentElement.dataset.theme = theme;

function readHash(){
  const h = location.hash.replace(/^#/, "");
  const params = new URLSearchParams(h);
  return {p: params.get("p") || "", t: params.get("t") || ""};
}

function readQuery(){
  return new URLSearchParams(location.search);
}

function showEmpty(msg){
  wrap.innerHTML = `<div class="empty">${msg}<br><br><a href="tablet.html">Trace one on the Cast Path page →</a></div>`;
}

const {p:raw, t:tStr} = readHash();
const ids = decodePath(raw);
const castTs = decodeTime(tStr);
const query = readQuery();

if(!ids.length){
  showEmpty("No constellation encoded in this link.");
} else {
  title.textContent = "Your path";
  const paintStops = () => {
    stops.innerHTML = ids.map((id,i)=>{
      const n=NODES[id];
      return `<span><i style="background:${catColor(n.c,theme)}"></i>${i+1}. ${n.n}</span>`;
    }).join("");
  };
  paintStops();

  const dateEl = document.getElementById("castDate");
  if(castTs){
    dateEl.textContent = new Date(castTs).toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
  } else {
    dateEl.textContent = "";
  }

  // Draw into the (hidden) canvas, then export to a PNG data URL and hand it to
  // the visible <img>. Mobile browsers offer "Save Image" on <img> long-press
  // but not on <canvas> — this swap is what makes the keepsake saveable to the
  // participant's camera roll.
  const starImg = document.getElementById("starImg");
  const drawScreen = () => {
    renderConstellation(star, ids, theme);
    try{ starImg.src = star.toDataURL("image/png") }catch(_){}
  };
  const drawPrint = () => renderConstellation(star, ids, theme, {print:true});
  requestAnimationFrame(drawScreen);

  // Re-export on resize so the saved image matches whatever the viewer is looking at.
  let resizeT = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeT);
    resizeT = setTimeout(()=>requestAnimationFrame(drawScreen), 120);
  });

  // Theme toggle — repaints constellation and stop chips with new palette
  themeBtn.onclick = () => {
    theme = theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    paintStops();
    requestAnimationFrame(drawScreen);
  };

  // Print: swap canvas to print-mode (pure greys, no starfield, higher DPR,
  // aspect-fit) → open browser print dialog → restore screen render after.
  printBtn.onclick = () => window.print();
  window.addEventListener("beforeprint", drawPrint);
  window.addEventListener("afterprint", drawScreen);
  // Some browsers apply print styles after beforeprint fires; a rAF-deferred
  // second draw catches that timing.
  try{
    matchMedia("print").addEventListener("change", e => {
      if(e.matches) requestAnimationFrame(drawPrint);
      else requestAnimationFrame(drawScreen);
    });
  }catch(_){}

  // ?print=1 (used by the Archive page's print button) auto-opens the browser
  // print dialog after the constellation has had a beat to render.
  if(query.get("print") === "1"){
    setTimeout(() => window.print(), 350);
  }
}
</script>
</body>
</html>
